<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로컬 브랜딩 기획 · 한국지리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF3E2;      /* 무명천 — 카드 바탕 */
  --paper-2:#F2E6CC;    /* 한 톤 어두운 천 — 눌린 면, 빈 칸 */
  --red:#C94A42;        /* 빨강 실 — 주요 동작, 액자 테두리 */
  --red-2:#E68B7E;
  --green:#6B9A52;      /* 초록 실 — 완료, 정답 */
  --green-2:#A9C68A;
  --denim:#5A7CA3;
  --denim-d:#456B8E;
  --mustard:#E0A93A;    /* 겨자 — 선택됨, 잠긴 덮개 */
  --pink:#E4989E;
  --plum:#8878B0;
  --sky:#8CBBD4;
  --ink:#4A3B32;        /* 갈색 잉크 — 본문 글자 */
  --muted:#8A7663;
  --stitch:#C9A98A;     /* 실 색 — 모든 점선 테두리 */
}
*{box-sizing:border-box}
body{
  margin:0; padding:0 0 40px; color:var(--ink);
  font-family:'Gowun Dodum',system-ui,sans-serif; font-size:16px; line-height:1.68;
  -webkit-text-size-adjust:100%;
  background-color:#F4EEDD;
  background-image:
    repeating-linear-gradient(0deg,  rgba(107,154,82,.15) 0 24px, transparent 24px 48px),
    repeating-linear-gradient(90deg, rgba(107,154,82,.15) 0 24px, transparent 24px 48px),
    repeating-linear-gradient(0deg,  rgba(201,74,66,.11) 0 5px,  transparent 5px 48px),
    repeating-linear-gradient(90deg, rgba(201,74,66,.11) 0 5px,  transparent 5px 48px);
  background-attachment:fixed;
}
h1,h2,h3,.jua{font-family:'Jua',sans-serif; font-weight:400; letter-spacing:-.01em; margin:0}
.wrap{max-width:680px; margin:0 auto; padding:4px 17px 0}

header.top{padding:26px 17px 4px; max-width:680px; margin:0 auto; position:relative}
header.top .eyebrow{font-size:14px; color:var(--muted)}
header.top h1{margin:8px 0 0; line-height:1.3}
header.top::after{
  content:'🧵'; position:absolute; top:24px; right:20px; font-size:28px;
  transform:rotate(18deg);
}
/* 잘라 붙인 제목 */
.cut{
  display:inline-block; background:#FFFDF7; padding:2px 11px; margin:0 3px 6px 0;
  font-family:'Gowun Batang',serif; font-weight:700; font-size:26px; color:#2E2620;
  box-shadow:1px 2px 0 rgba(74,59,50,.22);
}
.cutTitle .cut:nth-child(1){transform:rotate(-2.2deg)}
.cutTitle .cut:nth-child(2){transform:rotate(1.4deg)}
.cutTitle .cut:nth-child(3){transform:rotate(-1.6deg)}
.cutTitle .cut:nth-child(4){transform:rotate(1.1deg)}

/* 장식용 뜨개 줄무늬 구분선 */
.knitline{height:9px; max-width:646px; border-radius:8px; margin:16px auto 4px; overflow:hidden;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.45) 0 3px, transparent 3px 8px),
    linear-gradient(90deg,var(--red),var(--mustard),var(--green),var(--sky),var(--plum));
  box-shadow:inset 0 1px 2px rgba(74,59,50,.18);
}

/* 천 조각 카드 */
.card{
  background:var(--paper); border-radius:18px; padding:22px; margin:17px 0;
  position:relative;
  box-shadow:0 3px 0 rgba(74,59,50,.10), 0 10px 22px rgba(74,59,50,.10);
}
.card::before{
  content:''; position:absolute; inset:7px;
  border:2px dashed var(--stitch); border-radius:12px;
  pointer-events:none; opacity:.55;
}
.card.tight{padding:16px 18px}

/* 눌린 면 (요약 표시용) */
.sunk{background:var(--paper-2); border-radius:12px; box-shadow:inset 0 2px 6px rgba(74,59,50,.14); padding:16px}

/* 안내·지역뽑기·완료·랭킹 화면 = 라벨 액자 (이중 실선) */
#s-gate .card, #s-draw .card, #s-done .card, #s-rank .card{
  background:#FCF6E8; border:3px solid var(--red); border-radius:13px;
  box-shadow:0 3px 0 rgba(74,59,50,.13), 0 9px 18px rgba(74,59,50,.10);
}
#s-gate .card::before, #s-draw .card::before, #s-done .card::before, #s-rank .card::before{
  content:''; position:absolute; inset:4px;
  border:1.5px solid var(--red); border-radius:9px;
  pointer-events:none; opacity:.5;
}

label{display:block; font-family:'Jua',sans-serif; font-weight:400; font-size:16.5px; margin:18px 0 7px; color:var(--ink); letter-spacing:-.01em}
label .hint{font-family:'Gowun Dodum',sans-serif; font-size:13px; color:var(--muted); margin-left:6px}

input[type=text],input[type=number],textarea,select{
  font-family:inherit; font-size:16px; color:var(--ink); width:100%;
  background:#FFFDF6; border:2px dashed var(--stitch);
  border-radius:13px; padding:12px 14px; outline:none;
}
textarea{min-height:104px; resize:vertical; line-height:1.68}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--red) 50%),linear-gradient(135deg,var(--red) 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px, calc(100% - 14px) 22px; background-size:6px 6px,6px 6px; background-repeat:no-repeat; padding-right:40px}
input:focus,textarea:focus,select:focus{border-color:var(--red); border-style:solid}

/* 단추 버튼 */
button{
  font-family:'Jua',sans-serif; font-size:16px; letter-spacing:-.01em; border:0; cursor:pointer;
  color:var(--ink); background:var(--paper-2);
  border-radius:15px; padding:13px 18px; position:relative;
  box-shadow:0 3px 0 rgba(74,59,50,.20);
  transition:transform .1s, box-shadow .1s;
}
button::before{
  content:''; position:absolute; inset:4px;
  border:1.5px dashed rgba(255,255,255,.7); border-radius:11px;
  pointer-events:none;
}
button:active{transform:translateY(3px); box-shadow:0 0 0 rgba(0,0,0,0)}
button:focus-visible{outline:3px solid var(--mustard); outline-offset:3px}
button.primary{background:var(--red); color:#FFF6EC}
button.green{background:var(--green); color:#F5FBEF}
button.ghost{background:none; box-shadow:none; color:var(--muted); text-decoration:underline; padding:8px 4px}
button.ghost::before{display:none}
button.ghost:active{transform:none}
button[disabled]{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row>*{flex:1}
.right{display:flex; justify-content:space-between; gap:10px; margin-top:26px}

/* 헝겊 이름표 */
.pill{display:inline-block; background:var(--paper-2); color:var(--muted);
  border-radius:99px; padding:4px 14px; font-size:13.5px; font-family:'Jua',sans-serif; letter-spacing:-.01em;
  box-shadow:0 2px 0 rgba(74,59,50,.16); margin:0 6px 6px 0}
.pill.mint{background:var(--green-2); color:#33421F}
.pill.peach{background:var(--red); color:#FFF6EC}
.pill.lemon{background:var(--mustard); color:#3A2C10}

/* 진행 단계: 3칸 뜨개 줄무늬 */
.steps{display:flex; gap:8px; margin:14px 0 4px}
.steps div{flex:1; height:11px; border-radius:8px; position:relative; overflow:hidden;
  background:var(--paper-2); box-shadow:inset 0 2px 4px rgba(74,59,50,.16)}
.steps div::after{content:''; position:absolute; inset:0; opacity:0;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 3px, transparent 3px 7px)}
.steps div.on::after{opacity:1}
#p1.on{background:var(--red)}
#p2.on{background:var(--mustard)}
#p3.on{background:var(--green)}

.muted{color:var(--muted); font-size:14.5px}
.big{font-size:32px; line-height:1.3}
.center{text-align:center}
.counter{font-size:13px; color:var(--muted); text-align:right; margin-top:5px}
.counter.ok{color:var(--green)}

#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(140%);
  background:var(--ink); color:#FFFDF6; padding:12px 20px; border-radius:14px;
  font-family:'Jua',sans-serif; font-size:15px; z-index:99; max-width:88vw; text-align:center;
  box-shadow:0 3px 0 rgba(74,59,50,.25), 0 8px 16px rgba(74,59,50,.2);
  transition:transform .28s cubic-bezier(.2,.9,.3,1.2);
}
#toast.show{transform:translateX(-50%) translateY(0)}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px}

/* 갤러리 작품 = 손으로 붙인 사진 */
.work{background:#FFFDF6; border-radius:3px; padding:8px 8px 12px; text-align:center; cursor:pointer;
  box-shadow:0 3px 0 rgba(74,59,50,.10), 0 8px 16px rgba(74,59,50,.10)}
.work:nth-child(odd){transform:rotate(-1.3deg)}
.work:nth-child(even){transform:rotate(1.1deg)}
.work:active{box-shadow:0 8px 16px rgba(74,59,50,.10)}
.work img{width:100%; aspect-ratio:1; object-fit:contain; border-radius:3px;
  background:var(--paper-2) repeating-linear-gradient(45deg, rgba(201,169,138,.28) 0 8px, transparent 8px 16px)}
.work .imgMissing{width:100%; aspect-ratio:1; border-radius:3px}
.work .no{font-family:'Jua',sans-serif; font-size:13.5px; margin-top:8px; letter-spacing:-.01em}
.work .sl{font-size:12.5px; color:var(--muted); min-height:32px}
.work.mine{outline:3px dashed var(--red); outline-offset:-3px}

/* 덮는 창 (투표 상세) */
#modal{position:fixed; inset:0; background:rgba(46,38,32,.86); display:none; align-items:center; justify-content:center; padding:18px; z-index:80}
#modal.show{display:flex}
#modal .box{background:#FCF6E8; border:3px solid var(--red); border-radius:16px;
  padding:22px; max-width:420px; width:100%; max-height:88vh; overflow:auto}
#modal img{width:100%; border-radius:3px; background:var(--paper-2); padding:8px 8px 18px;
  box-shadow:0 3px 0 rgba(74,59,50,.10), 0 8px 16px rgba(74,59,50,.12)}
#modal .imgMissing{width:100%; aspect-ratio:1}

/* 사진 없을 때 자리 표시 (사선 무늬) */
.imgMissing{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  background:var(--paper-2) repeating-linear-gradient(45deg, rgba(201,169,138,.28) 0 8px, transparent 8px 16px);
  color:var(--muted); font-size:26px; text-align:center; box-sizing:border-box; padding:14px;
}
.imgMissing span{font-family:'Gowun Dodum',sans-serif; font-size:12.5px; line-height:1.4}

.drop{border-radius:13px; border:2px dashed var(--stitch); background:var(--paper-2); padding:22px; text-align:center; cursor:pointer}
.drop img{max-width:100%; max-height:230px; background:var(--paper-2); padding:8px 8px 18px;
  box-shadow:0 3px 0 rgba(74,59,50,.10), 0 8px 16px rgba(74,59,50,.12)}
.hidden{display:none !important}

.assetbox,.refbox{background:var(--paper-2); border:2px dashed var(--stitch); border-radius:13px; padding:14px 16px; margin:10px 0}
.assetbox label:first-child,.refbox label:first-child{margin-top:2px}
.del{font-size:13px; color:var(--red); background:none; box-shadow:none; border:none; padding:4px 0; text-decoration:underline}
.del::before{display:none}
.del:active{transform:none}

/* 마감 오버레이 = 봉인된 조각보 주머니 */
#lockOverlay{position:fixed; inset:0; background:rgba(46,38,32,.86); z-index:90; display:none; align-items:center; justify-content:center; padding:24px}
#lockOverlay.show{display:flex}
#lockOverlay .box{
  color:#3A2C10; border:3px solid var(--red); border-radius:16px;
  padding:30px 26px; text-align:center; max-width:340px;
  background-color:var(--mustard);
  background-image:
    repeating-linear-gradient(0deg,  rgba(255,255,255,.42) 0 9px, transparent 9px 18px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.42) 0 9px, transparent 9px 18px);
  box-shadow:0 3px 0 rgba(74,59,50,.25), 0 10px 22px rgba(74,59,50,.2);
}
#lockOverlay .box p.jua{font-size:20px; margin:10px 0 4px; color:#3A2C10}
#lockOverlay .lock-icon{font-size:36px}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<header class="top">
  <p class="eyebrow">한국지리 수행평가</p>
  <h1 class="cutTitle"><span class="cut">지역</span><span class="cut">자산으로</span><br><span class="cut">키링</span><span class="cut">브랜딩하기</span></h1>
</header>
<div class="knitline"></div>

<!-- 로그인 -->
<section id="s-login" class="wrap">
  <div class="card">
    <label for="sid">학번 5자리<span class="hint">학년1 + 반2 + 번호2 (예: 30301)</span></label>
    <input id="sid" type="text" inputmode="numeric" maxlength="5" placeholder="30301" autocomplete="off">
    <div class="right"><span></span><button class="primary" onclick="doLogin()">들어가기</button></div>
  </div>
</section>

<!-- 안내(대기/종료) -->
<section id="s-gate" class="wrap hidden">
  <div class="card center"><p class="big jua" id="gate-title">아직 열리지 않았어요</p><p class="muted" id="gate-desc"></p></div>
</section>

<!-- 지역 뽑기 -->
<section id="s-draw" class="wrap hidden">
  <div class="card center">
    <p class="muted" id="draw-hello"></p>
    <p class="big jua">지역을 뽑아 보세요</p>
    <p class="muted">한 번 뽑으면 바꿀 수 없고, 친구와 겹치지 않아요.</p>
    <div class="sunk center" style="margin:20px 0"><span class="big jua" id="draw-result">? ? ?</span></div>
    <button class="primary" id="draw-btn" onclick="drawRegion()" style="width:100%">지역 뽑기</button>
    <button class="ghost hidden" id="draw-next" onclick="goForm()">기획서 쓰러 가기</button>
  </div>
</section>

<!-- 제출 폼 -->
<section id="s-form" class="wrap hidden">
  <div class="card tight">
    <div class="row" style="align-items:center">
      <span class="pill mint" id="f-region">지역</span>
      <span class="pill" id="f-who">학생</span>
    </div>
    <div class="steps"><div id="p1"></div><div id="p2"></div><div id="p3"></div></div>
    <p class="muted" id="f-stepname" style="margin:8px 0 0">1단계 · 지역 자산 조사</p>
  </div>

  <!-- Step 1 -->
  <div class="card step" id="step1">
    <label>① 브랜딩할 지역 자산은 무엇인가요?</label>
    <input id="assetName" type="text" placeholder="예: 보성 녹차밭">

    <label>② 자산 유형과 그 지리적 요인<span class="hint">유형마다 왜 이 지역에서 생겼는지 쓰기</span></label>
    <div id="assets"></div>
    <button onclick="addAsset()" id="addAssetBtn">＋ 자산 유형 추가</button>

    <label>③ 이 자산이 만들어진 과정<span class="hint">200자 이상 권장</span></label>
    <textarea id="formation" placeholder="기후·지형·하천·입지·역사 중 무엇이 이 자산을 만들었는지 이어서 설명해 보세요."></textarea>
    <div class="counter" id="c-formation">0자</div>

    <label>④ 참고 자료<span class="hint">최소 1개</span></label>
    <div id="refs"></div>
    <button onclick="addRef()">＋ 자료 추가</button>

    <div class="right"><span></span><button class="primary" onclick="go(2)">다음</button></div>
  </div>

  <!-- Step 2 -->
  <div class="card step hidden" id="step2">
    <label>⑤ 슬로건<span class="hint">지리적 특성이 드러나게 한 줄</span></label>
    <input id="slogan" type="text" placeholder="예: 안개가 키운 초록, 보성">

    <label>⑥ 키링 도안 이미지</label>
    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      <span id="drop-text" class="jua">눌러서 이미지 올리기</span>
      <img id="preview" class="hidden" alt="올린 도안 미리보기">
    </div>
    <input id="file" type="file" accept="image/*" class="hidden" onchange="pickImage(event)">
    <p class="muted" id="imgStatus" style="margin-top:6px"></p>

    <label>⑦ 이 도안에 담은 지리적 특성</label>
    <textarea id="designDesc" placeholder="색·모양·요소가 이 지역의 무엇을 나타내는지 설명해 주세요."></textarea>

    <label>⑧ 사용한 AI 도구</label>
    <select id="aiTool">
      <option value="">선택하세요</option>
      <option>ChatGPT</option><option>Canva</option><option>미리캔버스</option><option>Midjourney</option><option>기타</option>
    </select>

    <label>⑨ AI에 넣은 프롬프트 원문</label>
    <textarea id="prompt" placeholder="쓴 그대로 붙여넣기"></textarea>

    <label>⑩ 처음 결과물을 어떻게 고쳤나요?</label>
    <textarea id="revision" placeholder="예: 찻잎이 너무 사실적이어서 단순한 도형으로 바꿔달라고 다시 요청했다."></textarea>

    <label>⑪ 이 키링을 살 사람은 누구인가요?</label>
    <input id="target" type="text" placeholder="예: 녹차밭 사진 찍으러 오는 20대 여행객">

    <div class="right"><button onclick="go(1)">이전</button><button class="primary" onclick="go(3)">다음</button></div>
  </div>

  <!-- Step 3 -->
  <div class="card step hidden" id="step3">
    <label>⑫ 이 키링을 어디에서 팔거나 나눠 줄 건가요?</label>
    <input id="place" type="text" placeholder="예: 보성 녹차밭 입구 매표소, 벌교역 관광안내소">

    <label>⑬ 어떤 방식으로 전달할 건가요?</label>
    <input id="method" type="text" placeholder="예: 입장권 구매 시 세트 판매, SNS 인증 시 증정">

    <label>⑭ 얼마에 팔고, 왜 그 가격인가요?</label>
    <textarea id="price" placeholder="제작 원가, 비슷한 굿즈 가격, 살 사람의 지불 의사를 함께 생각해 보세요."></textarea>

    <label>⑮ 지역 변화 ❶</label>
    <select id="change1Key" onchange="syncChange()"><option value="">관점을 고르세요</option></select>
    <p class="muted" id="q1" style="margin:8px 0"></p>
    <textarea id="change1"></textarea>

    <label>⑯ 지역 변화 ❷<span class="hint">❶과 다른 관점</span></label>
    <select id="change2Key" onchange="syncChange()"><option value="">관점을 고르세요</option></select>
    <p class="muted" id="q2" style="margin:8px 0"></p>
    <textarea id="change2"></textarea>

    <div class="right"><button onclick="go(2)">이전</button><button class="primary" id="submitBtn" onclick="submitAll()">제출하기</button></div>
    <p class="muted center" style="margin-top:12px">마감 전에는 다시 들어와 고칠 수 있어요.</p>
  </div>
</section>

<!-- 제출 완료 -->
<section id="s-done" class="wrap hidden">
  <div class="card center">
    <p class="big jua">제출했어요</p>
    <p class="muted">작품 번호 <b id="d-work"></b> · <span id="d-region"></span></p>
    <img id="d-img" style="width:60%; border-radius:18px; background:#fff; margin:14px 0" alt="내가 낸 도안">
    <p class="jua" id="d-slogan"></p>
    <button onclick="goForm()">고치러 가기</button>
  </div>
</section>

<!-- 갤러리 · 투표 -->
<section id="s-gallery" class="wrap hidden">
  <div class="card tight center">
    <p class="jua" style="font-size:20px; margin:0">마음에 드는 작품에 한 표</p>
    <p class="muted" id="g-status">한 사람당 한 표, 바꿀 수 없어요.</p>
  </div>
  <div class="grid" id="grid"></div>
</section>

<!-- 결과 -->

  <div class="card center"><p class="big jua">가장 많은 표를 받은 세 작품</p><p class="muted">실제 키링으로 만들어 드립니다.</p></div>
  <div id="rank"></div>
</section>

<!-- 반이 잠겼을 때 뜨는 마감 오버레이 -->
<div id="lockOverlay">
  <div class="box">
    <div class="lock-icon">🔒</div>
    <p class="jua">제출이 마감되었습니다</p>
    <p style="margin:0">더 이상 내용을 고칠 수 없어요.<br>선생님 안내를 기다려 주세요.</p>
  </div>
</div>

<div id="toast"></div>

<script>
/* ===== 배포한 Apps Script 웹앱 URL을 넣으세요 ===== */
const API = 'https://script.google.com/macros/s/AKfycbyGCnJgxXIYOK_tQrHWjATpFZ71MB4VV1nbQhNK5DLIfWiiuvPk1chQewfYvSuSdybGLQ/exec';

const CHANGES = {
  inflow:{label:'유입 인구 변화', q:'이 키링이 잘 팔린다면 이 지역을 찾는 사람은 어떤 유형이고, 얼마나 늘어날까요? 그렇게 본 근거는?'},
  economy:{label:'지역 경제 파급효과', q:'방문객이 늘면 이 지역의 어떤 산업·상권이 영향을 받을까요? 구체적인 업종이나 장소를 들어 설명해 주세요.'},
  image:{label:'장소 이미지 변화', q:'지금 이 지역은 밖에서 어떤 이미지인가요? 브랜딩 뒤에는 어떻게 바뀌길 기대하나요?'},
  structure:{label:'공간 구조 변화', q:'브랜딩이 오래 성공한다면 토지 이용·상업지역·교통 같은 공간 구조는 어떻게 달라질까요?'}
};

let ME=null, PHASE='ready', IMG=null, IMG_MIME=null, THUMB=null, CUR=1, POLL=null;

/* --- 통신 --- */
async function api(action, payload={}){
  const res = await fetch(API,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, payload))
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || '알 수 없는 오류');
  return data;
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3200);
}
function show(id){
  ['s-login','s-gate','s-draw','s-form','s-done','s-gallery','s-rank']
    .forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id));
  window.scrollTo(0,0);
}

/* --- 로그인 --- */
async function doLogin(){
  const sid=document.getElementById('sid').value.trim();
  if(!/^\d{5}$/.test(sid)) return toast('학번 5자리를 정확히 입력해 주세요.');
  try{
    const r=await api('login',{sid});
    ME={sid, name:r.student.name, klass:r.student.klass, region:r.region, submitted:r.submitted, voted:r.voted};
    PHASE=r.phase;
    sessionStorage.setItem('sid',sid);
    routePhase();
    startPolling();
  }catch(e){ toast(e.message); }
}

/* 제출 화면이 떠 있는 동안 30초마다 내 반 단계를 확인해서, 선생님이 잠그면 즉시 화면을 덮는다 */
function startPolling(){
  clearInterval(POLL);
  POLL=setInterval(async ()=>{
    if(!ME) return;
    try{
      const r=await api('getConfig',{sid:ME.sid});
      PHASE=r.phase;
      const onFormScreens = !document.getElementById('s-form').classList.contains('hidden')
                          || !document.getElementById('s-draw').classList.contains('hidden');
      document.getElementById('lockOverlay').classList.toggle('show', PHASE==='locked' && onFormScreens);
    }catch(e){}
  },30000);
}

function routePhase(){
  document.getElementById('f-who').textContent = ME.klass+'반 '+ME.name;
  document.getElementById('lockOverlay').classList.remove('show');
  if(PHASE==='submit'){
    if(!ME.region){ document.getElementById('draw-hello').textContent=ME.name+'님, 반가워요'; return show('s-draw'); }
    if(ME.submitted) return showDone();
    return goForm();
  }
  if(PHASE==='locked'){
    if(ME.submitted) return showDone();
    return gate('제출이 마감되었어요', '기획서를 내지 못했다면 선생님께 알려주세요.');
  }
  if(PHASE==='vote') return loadGallery();
  if(PHASE==='result') return loadRanking();
  gate(PHASE==='ready' ? '아직 열리지 않았어요' : '수행평가가 끝났어요',
       PHASE==='ready' ? '선생님이 시작하면 이 화면이 바뀝니다.' : '채점 중입니다. 결과는 수업에서 안내할게요.');
}
function gate(t,d){
  document.getElementById('gate-title').textContent=t;
  document.getElementById('gate-desc').textContent=d;
  show('s-gate');
}

/* --- 지역 뽑기 --- */
async function drawRegion(){
  const btn=document.getElementById('draw-btn'); btn.disabled=true; btn.textContent='뽑는 중…';
  try{
    const r=await api('assignRegion',{sid:ME.sid});
    ME.region=r.region;
    document.getElementById('draw-result').textContent=r.region;
    btn.classList.add('hidden');
    document.getElementById('draw-next').classList.remove('hidden');
  }catch(e){ toast(e.message); btn.disabled=false; btn.textContent='지역 뽑기'; }
}

/* --- 폼 --- */
async function goForm(){
  document.getElementById('f-region').textContent=ME.region;
  if(!document.getElementById('assets').children.length){ addAsset(); addRef(); fillChangeSelects(); }
  try{
    const r=await api('getSubmission',{sid:ME.sid});
    if(r.data){
      fillForm(r.data);
    } else {
      restoreDraft(); // 서버에 낸 적이 없으면, 이 기기에 임시저장된 내용이 있는지 확인
    }
  }catch(e){}
  go(1); show('s-form');
}

/* --- 임시저장: 서버 제출 전까지, 입력하는 동안 이 브라우저에만 계속 저장해 둔다.
   새로고침·탭을 닫았다 다시 열어도(같은 기기·같은 브라우저라면) 복구된다.
   제출 조건(필수 항목)은 그대로 두고, 그 전 단계의 안전망만 추가하는 것이라
   "하나라도 비면 제출 안 됨" 규칙과는 무관하다. --- */
function draftKey_(){ return ME ? 'draft_'+ME.sid : null; }

function saveDraftLocal(){
  if(!ME || ME.submitted) return; // 이미 서버에 제출된 뒤에는 임시저장할 필요 없음
  try{
    const d=collect();
    d.imgData=IMG; d.imgMime=IMG_MIME; d.thumbData=THUMB;
    const p=document.getElementById('preview');
    d.imgPreviewSrc = (!p.classList.contains('hidden')) ? p.src : '';
    sessionStorage.setItem(draftKey_(), JSON.stringify(d));
  }catch(e){ /* 용량 초과 등은 무시 - 임시저장은 있으면 좋은 기능이지 핵심 기능이 아님 */ }
}

let draftTimer=null;
function scheduleDraftSave(){ clearTimeout(draftTimer); draftTimer=setTimeout(saveDraftLocal, 800); }

function restoreDraft(){
  const key=draftKey_(); if(!key) return;
  const raw=sessionStorage.getItem(key); if(!raw) return;
  try{
    const d=JSON.parse(raw);
    fillForm(d);
    if(d.imgPreviewSrc){
      const p=document.getElementById('preview');
      p.src=d.imgPreviewSrc; p.classList.remove('hidden');
      document.getElementById('drop-text').textContent='다른 이미지로 바꾸기';
      document.getElementById('imgStatus').textContent='임시 저장된 이미지를 불러왔어요';
    }
    IMG=d.imgData||null; IMG_MIME=d.imgMime||null; THUMB=d.thumbData||null;
    toast('저장해둔 내용을 불러왔어요.');
  }catch(e){}
}

function go(n){
  CUR=n;
  saveDraftLocal(); // 단계를 넘어갈 때도 한 번 더 저장 (디바운스 타이머를 기다리지 않도록)
  [1,2,3].forEach(i=>document.getElementById('step'+i).classList.toggle('hidden', i!==n));
  [1,2,3].forEach(i=>document.getElementById('p'+i).classList.toggle('on', i<=n));
  document.getElementById('f-stepname').textContent =
    n===1?'1단계 · 지역 자산 조사' : n===2?'2단계 · 키링 디자인' : '3단계 · 마케팅 기획';
  window.scrollTo(0,0);
}

function addAsset(v){
  const box=document.getElementById('assets');
  if(box.children.length>=4) return toast('자산 유형은 최대 4개까지예요.');
  const i=box.children.length+1;
  const d=document.createElement('div'); d.className='assetbox';
  d.innerHTML=`
    <label>자산 유형 ${i}</label>
    <select class="a-type">
      <option value="">선택하세요</option>
      <option>자연 자산 (지형·기후·하천·생태)</option>
      <option>인문 자산 (역사·문화·축제·전통)</option>
      <option>산업 자산 (특산물·제조업·농수산업)</option>
      <option>관광 자산 (관광지·체험시설·경관)</option>
    </select>
    <label>이 유형의 지리적 요인<span class="hint">기후·지형·하천·입지·역사 등</span></label>
    <textarea class="a-geo" style="min-height:80px"></textarea>
    ${i>1?'<button class="del" onclick="this.parentNode.remove()">이 유형 지우기</button>':''}`;
  box.appendChild(d);
  if(v){ d.querySelector('.a-type').value=v.type||''; d.querySelector('.a-geo').value=v.geo||''; }
}

function addRef(v){
  const box=document.getElementById('refs');
  const i=box.children.length+1;
  const d=document.createElement('div'); d.className='refbox';
  d.innerHTML=`
    <label>자료 ${i} 제목</label><input class="r-title" type="text" placeholder="예: 보성군 녹차산업 현황">
    <label>링크 또는 출처</label><input class="r-url" type="text" placeholder="https:// 또는 책·기사 이름">
    <label>자료 종류</label>
    <select class="r-kind">
      <option value="">선택하세요</option>
      <option>정부·공공기관</option><option>학술자료</option><option>언론보도</option><option>지자체</option><option>기타</option>
    </select>
    ${i>1?'<button class="del" onclick="this.parentNode.remove()">이 자료 지우기</button>':''}`;
  box.appendChild(d);
  if(v){ d.querySelector('.r-title').value=v.title||''; d.querySelector('.r-url').value=v.url||''; d.querySelector('.r-kind').value=v.kind||''; }
}

function fillChangeSelects(){
  [1,2].forEach(n=>{
    const s=document.getElementById('change'+n+'Key');
    Object.keys(CHANGES).forEach(k=>{
      const o=document.createElement('option'); o.value=k; o.textContent=CHANGES[k].label; s.appendChild(o);
    });
  });
}
function syncChange(){
  const a=document.getElementById('change1Key').value, b=document.getElementById('change2Key').value;
  document.getElementById('q1').textContent = a?CHANGES[a].q:'';
  document.getElementById('q2').textContent = b?CHANGES[b].q:'';
  [['change2Key',a],['change1Key',b]].forEach(([id,other])=>{
    [...document.getElementById(id).options].forEach(o=>{ o.disabled = o.value && o.value===other; });
  });
  if(a && a===b){ document.getElementById('change2Key').value=''; document.getElementById('q2').textContent=''; toast('❶과 다른 관점을 골라 주세요.'); }
}

/* --- 이미지: 긴 변 1100px로 줄이고, JPEG 압축을 단계적으로 낮춰 700KB 아래로.
   갤러리에서는 이미지가 파일 링크가 아니라 데이터 자체로 한 번에 전송되기 때문에,
   여기서 미리 넉넉히 줄여 둬야 투표 화면이 무겁지 않다. --- */
function pickImage(ev){
  const f=ev.target.files[0]; if(!f) return;
  const status=document.getElementById('imgStatus');
  status.textContent='이미지 준비 중…';
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1100, sc=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);

      function tryEncode(canvas, quality, format){
        return canvas.toDataURL(format, quality);
      }
      const TARGET=700*1024;
      let url=tryEncode(c,0.85,'image/jpeg');
      let bytes=Math.round(url.length*0.75);
      let q=0.85;
      while(bytes>TARGET && q>0.35){
        q-=0.1;
        url=tryEncode(c,q,'image/jpeg');
        bytes=Math.round(url.length*0.75);
      }
      IMG=url.split(',')[1]; IMG_MIME='image/jpeg';

      // 갤러리·투표 화면용 작은 미리보기를 따로 만든다. 구글시트 한 칸(5만자)에
      // 그대로 들어가야 하므로, 이 미리보기는 훨씬 더 작게 줄인다.
      const tc=document.createElement('canvas');
      let tside=460;
      function drawThumb(side){
        const s=Math.min(1, side/Math.max(img.width,img.height));
        tc.width=Math.round(img.width*s); tc.height=Math.round(img.height*s);
        tc.getContext('2d').drawImage(img,0,0,tc.width,tc.height);
      }
      drawThumb(tside);
      let turl=tryEncode(tc,0.6,'image/jpeg'), tq=0.6, tries=0;
      while(turl.length>40000 && tries<8){
        if(tq>0.35){ tq-=0.1; } else { tside=Math.round(tside*0.85); drawThumb(tside); tq=0.6; }
        turl=tryEncode(tc,tq,'image/jpeg');
        tries++;
      }
      THUMB = turl.length<=44000 ? turl : null; // 그래도 크면 미리보기는 포기하고 서버 쪽 대체 경로에 맡긴다

      const p=document.getElementById('preview');
      p.src=url; p.classList.remove('hidden');
      document.getElementById('drop-text').textContent='다른 이미지로 바꾸기';
      status.textContent=`올릴 준비 완료 (약 ${(bytes/1024).toFixed(0)}KB)`;
      console.log('[이미지 준비 완료]', 'IMG bytes≈'+bytes, 'THUMB', THUMB ? (THUMB.length+'자') : '생성 실패(null)');
    };
    img.onerror=()=>{ status.textContent=''; toast('이미지를 읽지 못했어요. 다른 파일로 시도해 주세요.'); };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

function collect(){
  const assets=[...document.querySelectorAll('#assets .assetbox')].map(d=>({
    type:d.querySelector('.a-type').value, geo:d.querySelector('.a-geo').value.trim()
  })).filter(a=>a.type);
  const refs=[...document.querySelectorAll('#refs .refbox')].map(d=>({
    title:d.querySelector('.r-title').value.trim(), url:d.querySelector('.r-url').value.trim(), kind:d.querySelector('.r-kind').value
  })).filter(r=>r.title);
  const v=id=>document.getElementById(id).value.trim();
  // change1Key/change2Key는 서버가 저장하는 모양(한글 라벨)으로 맞춰서 내보낸다.
  // 이러면 서버에서 받은 데이터든 이 브라우저의 임시저장이든 fillForm() 하나로 똑같이 복원된다.
  const chLabel=k=>CHANGES[k]?CHANGES[k].label:'';
  return {
    assetName:v('assetName'), assets, formation:v('formation'), refs,
    slogan:v('slogan'), designDesc:v('designDesc'), aiTool:v('aiTool'), prompt:v('prompt'),
    revision:v('revision'), target:v('target'),
    place:v('place'), method:v('method'), price:v('price'),
    change1Key:chLabel(v('change1Key')), change1:v('change1'), change2Key:chLabel(v('change2Key')), change2:v('change2')
  };
}

function fillForm(d){
  const set=(id,val)=>{ if(document.getElementById(id)) document.getElementById(id).value=val||''; };
  set('assetName',d.assetName); set('formation',d.formation);
  set('slogan',d.slogan); set('designDesc',d.designDesc); set('aiTool',d.aiTool);
  set('prompt',d.prompt); set('revision',d.revision); set('target',d.target);
  set('place',d.place); set('method',d.method); set('price',d.price);
  const key=lbl=>Object.keys(CHANGES).find(k=>CHANGES[k].label===lbl)||'';
  set('change1Key',key(d.change1Key)); set('change1',d.change1);
  set('change2Key',key(d.change2Key)); set('change2',d.change2);
  syncChange();
  document.getElementById('assets').innerHTML=''; (d.assets||[]).forEach(a=>addAsset(a)); if(!d.assets||!d.assets.length) addAsset();
  document.getElementById('refs').innerHTML=''; (d.refs||[]).forEach(r=>addRef(r)); if(!document.getElementById('refs').children.length) addRef();
  if(d.imageUrl){
    const p=document.getElementById('preview'); p.src=d.imageUrl; p.classList.remove('hidden');
    document.getElementById('drop-text').textContent='다른 이미지로 바꾸기';
    document.getElementById('imgStatus').textContent='이미 올라간 도안이 있어요';
    IMG=null;
  }
  ME.saved=d;
  document.getElementById('c-formation').textContent=(d.formation||'').length+'자';
}

async function submitAll(){
  const d=collect();
  const need=[['assetName','자산명'],['formation','형성 과정'],['slogan','슬로건'],['designDesc','도안 설명'],
              ['target','타겟'],['place','판매·배포 장소'],['method','판매·배포 방식'],['price','예상 가격']];
  for(const [k,ko] of need) if(!d[k]) return toast(ko+' 칸이 비어 있어요.');
  if(!d.assets.length || d.assets.some(a=>!a.geo)) return toast('자산 유형마다 지리적 요인을 써 주세요.');
  if(d.refs.length<1) return toast('참고 자료를 1개 이상 넣어 주세요.');
  if(!d.change1Key || !d.change2Key) return toast('지역 변화 관점을 2개 골라 주세요.');
  if(!d.change1 || !d.change2) return toast('고른 관점에 대한 서술을 채워 주세요.');
  if(!IMG && !(ME.saved && ME.saved.imageFileId)) return toast('키링 도안 이미지를 올려 주세요.');

  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='보내는 중…';
  console.log('[제출 전송]', 'IMG', IMG?IMG.length+'자':'(재제출, 새 이미지 없음)', 'THUMB', THUMB?THUMB.length+'자':'(재제출, 새 미리보기 없음)');
  try{
    const r=await api('submit',{sid:ME.sid, data:d, imageBase64:IMG, imageMime:IMG_MIME, thumbBase64:THUMB});
    ME.submitted=true; IMG=null; THUMB=null;
    sessionStorage.removeItem(draftKey_()); // 서버에 정식으로 실렸으니 이제 이 기기의 임시저장은 필요 없음
    toast(r.updated?'수정한 내용을 저장했어요.':'제출 완료!');
    showDone();
  }catch(e){ toast(e.message); }
  finally{ btn.disabled=false; btn.textContent='제출하기'; }
}

async function showDone(){
  const r=await api('getSubmission',{sid:ME.sid});
  const d=r.data; if(!d) return goForm();
  ME.saved=d;
  document.getElementById('d-work').textContent=d.workId;
  document.getElementById('d-region').textContent=d.region;
  const img=document.getElementById('d-img');
  if(d.imageUrl){ img.src=d.imageUrl; img.classList.remove('hidden'); }
  else { img.classList.add('hidden'); }
  document.getElementById('d-slogan').textContent='“'+d.slogan+'”';
  show('s-done');
}

/* --- 갤러리 · 투표 --- */
async function loadGallery(){
  try{
    const r=await api('getGallery',{sid:ME.sid});
    console.log('[갤러리 응답]', r.items.map(it=>({workId:it.workId, imageUrl_길이: it.imageUrl?it.imageUrl.length+'자':'(비어있음)'})));
    ME.voted=r.voted;
    document.getElementById('g-status').textContent = r.voted ? '투표를 마쳤어요. 다른 작품도 구경해 보세요.' : '한 사람당 한 표, 바꿀 수 없어요.';
    const g=document.getElementById('grid'); g.innerHTML='';
    r.items.forEach(it=>{
      const d=document.createElement('div');
      d.className='work'+(it.isMine?' mine':'');
      d.innerHTML=`${imgHtml(it.imageUrl, '작품 '+it.workId)}
        <div class="no">${it.workId}${it.isMine?' · 내 작품':''}</div>
        <div class="sl">“${esc(it.slogan)}”</div>`;
      d.onclick=()=>openWork(it);
      g.appendChild(d);
    });
    show('s-gallery');
  }catch(e){ gate('갤러리 준비 중', e.message); }
}
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 이미지 데이터가 통째로 JSON에 실려 오는 방식이라, 안 나오는 경우는 딱 하나 -
// 서버가 보낼 데이터 자체가 비어 있는 경우뿐이다(예: 원본 파일을 못 찾음).
// 그럴 때 깨진 이미지 아이콘 대신 상황을 알 수 있는 안내를 보여준다.
function imgHtml(url, alt, style){
  style = style || '';
  if (url) return `<img src="${url}" alt="${esc(alt)}" loading="lazy" style="${style}">`;
  return `<div class="imgMissing" style="${style}">🖼<span>이미지를 불러올 수 없어요</span></div>`;
}

function openWork(it){
  const b=document.getElementById('modal-box');
  b.innerHTML=`${imgHtml(it.imageUrl, '작품 '+it.workId)}
    <p class="jua" style="font-size:19px; margin:14px 0 4px">“${esc(it.slogan)}”</p>
    <p class="muted">${esc(it.region)} · ${esc(it.assetName)}</p>
    <div class="sunk" style="margin:12px 0">${esc(it.designDesc)}</div>
    <div class="right">
      <button onclick="closeModal(null,true)">닫기</button>
      ${it.isMine ? '<button disabled>내 작품이에요</button>'
        : ME.voted ? '<button disabled>이미 투표했어요</button>'
        : `<button class="primary" onclick="castVote('${it.workId}')">이 작품에 투표</button>`}
    </div>`;
  document.getElementById('modal').classList.add('show');
}
function closeModal(ev,force){ if(force||ev.target.id==='modal') document.getElementById('modal').classList.remove('show'); }

async function castVote(workId){
  try{ await api('vote',{sid:ME.sid, workId}); toast('투표했어요!'); closeModal(null,true); loadGallery(); }
  catch(e){ toast(e.message); }
}

/* --- 결과 --- */
async function loadRanking(){
  try{
    const r=await api('getRanking');
    const box=document.getElementById('rank'); box.innerHTML='';
    const medal=['🥇','🥈','🥉'];
    r.top.forEach(t=>{
      const d=document.createElement('div'); d.className='card center';
      d.innerHTML=`<p class="big">${medal[t.rank-1]}</p>
        ${imgHtml(t.imageUrl, t.rank+'위 작품', 'width:62%; border-radius:18px; background:#fff')}
        <p class="jua" style="font-size:19px; margin:12px 0 2px">“${esc(t.slogan)}”</p>
        <p class="muted">${esc(t.region)}</p>`;
      box.appendChild(d);
    });
    show('s-rank');
  }catch(e){ gate('결과 공개 전이에요', e.message); }
}

/* --- 초기화 --- */
document.getElementById('formation').addEventListener('input',e=>{
  const n=e.target.value.length, c=document.getElementById('c-formation');
  c.textContent=n+'자'+(n<200?' (200자 이상 권장)':' · 충분해요');
  c.classList.toggle('ok', n>=200);
});
document.getElementById('sid').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('s-form').addEventListener('input', scheduleDraftSave);
document.getElementById('s-form').addEventListener('change', scheduleDraftSave);
(function(){ const s=sessionStorage.getItem('sid'); if(s){ document.getElementById('sid').value=s; doLogin(); } })();
</script>
