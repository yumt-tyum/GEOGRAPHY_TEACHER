<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 패널 · 로컬 브랜딩 수행평가</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4ECD8; --paper-2:#FBF6EA; --kraft:#E2CFA5;
  --ink:#4A3728; --ink-soft:#8A7660;
  --terracotta:#C1572E; --map-blue:#3C6E8F; --moss:#6B7F4F; --mustard:#D9A441;
  --line:#C9B48C;
}
*{box-sizing:border-box}
body{margin:0;padding:0 0 60px;background:var(--paper);color:var(--ink);font-family:'Gowun Dodum',sans-serif;line-height:1.7}
h1,h2,h3,button,.jua,th{font-family:'Gaegu',sans-serif;font-weight:700}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px}
.card{background:var(--paper-2);border-radius:4px 16px 4px 16px;border:1px solid rgba(74,55,40,.09);
  box-shadow:0 8px 18px rgba(74,55,40,.12);padding:20px;margin:14px 0}
input,select,textarea{border:1.5px solid var(--line);outline:none;background:var(--paper);border-radius:4px 10px 4px 10px;
  padding:11px 14px;font-family:inherit;font-size:15px;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--terracotta); box-shadow:0 0 0 3px rgba(193,87,46,.16)}
button{border:2px solid var(--ink);cursor:pointer;background:var(--paper-2);color:var(--ink);
  border-radius:4px 10px 4px 10px;padding:9px 16px;font-size:15px;
  box-shadow:2px 2px 0 var(--ink); transition:box-shadow .1s,transform .1s}
button:active{box-shadow:0 0 0 var(--ink);transform:translate(2px,2px)}
button.primary{background:var(--terracotta);color:#FBF6EA;border-color:var(--ink)}
button.on{background:var(--moss);color:#FBF6EA;border-color:var(--ink)}
button.warn.on{background:var(--terracotta);color:#FBF6EA;border-color:var(--ink)}
button[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-soft);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:9px 8px;text-align:left;border-bottom:1.5px dashed var(--line)}
th{color:var(--ink-soft);font-size:13.5px;font-weight:700}
tr.clickable:hover{background:var(--paper);cursor:pointer}
.tag{display:inline-block;padding:2px 12px;border-radius:999px;font-size:12.5px;border:1.5px solid currentColor}
.tag.done{color:var(--moss)}
.tag.ai{color:#8a6a1f}
.tag.none{color:var(--terracotta)}
.hidden{display:none !important}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.scorebox{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scorebox label{font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:4px;font-family:'Gowun Dodum',sans-serif;font-weight:400}
.field{background:var(--paper);border:1px solid rgba(74,55,40,.08);border-radius:4px 12px 4px 12px;padding:11px 14px;margin:8px 0;white-space:pre-wrap;font-size:14.5px}
.field b{font-family:'Gaegu',sans-serif;font-weight:700;display:block;color:var(--ink-soft);font-size:13px;margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(150%);background:var(--ink);color:var(--paper-2);
  padding:12px 22px;border-radius:4px 14px 4px 14px;font-family:'Gaegu',sans-serif;font-weight:700;
  box-shadow:3px 3px 0 rgba(0,0,0,.2); transition:transform .28s;z-index:99}
#toast.show{transform:translateX(-50%) translateY(0)}
.total{font-size:30px;font-family:'Gaegu',sans-serif;font-weight:700;color:var(--terracotta)}
.classcard{background:var(--paper);border:1.5px dashed var(--line);border-radius:4px 14px 4px 14px;padding:14px 16px;margin:8px 0}
.classcard h3{margin:0 0 8px;font-size:17px}
.bar{height:8px;border-radius:999px;background:var(--kraft);overflow:hidden;margin:6px 0}
.bar>div{height:100%;background:var(--terracotta)}
</style>
</head>
<body>
<div class="wrap">
  <h1 style="font-size:24px;margin:20px 0 0">교사 패널 · 로컬 브랜딩 수행평가</h1>
  <p class="muted" style="margin:2px 0 0">한국지리 3학년 A·B·G반</p>

  <!-- PIN -->
  <div class="card" id="pinCard">
    <div class="row">
      <input id="pin" type="password" placeholder="관리자 PIN" style="max-width:220px" autocomplete="off">
      <button class="primary" onclick="login()">열기</button>
    </div>
  </div>

  <div id="panel" class="hidden">
    <!-- 반별 제출 단계 -->
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:18px">반별 제출 단계</h2>
      <p class="muted" style="margin:0 0 10px">반마다 수업 시기가 달라도 따로 열고 닫을 수 있어요. 전체 단계가 '대기'일 때만 적용됩니다.</p>
      <div id="classPhaseBox"></div>
    </div>

    <!-- 전체 단계 -->
    <div class="card">
      <h2 style="margin:0 0 10px;font-size:18px">전체 진행 단계</h2>
      <div class="row" id="phaseBtns"></div>
      <p class="muted" id="phaseHelp" style="margin:10px 0 0"></p>
    </div>

    <!-- 현황 -->
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0;font-size:18px">현황</h2>
        <div class="row">
          <button onclick="loadAll()">새로고침</button>
          <button onclick="recount()">득표수 재집계</button>
          <button id="sheetBtn">구글시트 열기</button>
        </div>
      </div>
      <div id="status" style="margin-top:12px"></div>
    </div>

    <!-- 목록 -->
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0;font-size:18px">제출물 · 채점</h2>
        <div class="row">
          <select id="filter" style="width:auto" onchange="renderList()">
            <option value="">전체</option><option value="미채점">미채점만</option><option value="AI추천">AI추천만</option><option value="확정">확정만</option>
          </select>
          <button onclick="gradeAll()" id="allBtn">미채점 전체 AI 채점</button>
        </div>
      </div>
      <div style="overflow-x:auto"><table id="list"></table></div>
    </div>

    <!-- 상세 -->
    <div class="card hidden" id="detail"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ===== 배포한 Apps Script 웹앱 URL을 넣으세요 (index.html과 동일) ===== */
const API='https://script.google.com/macros/s/AKfycbyGCnJgxXIYOK_tQrHWjATpFZ71MB4VV1nbQhNK5DLIfWiiuvPk1chQewfYvSuSdybGLQ/exec';
const PHASE_LABELS={ready:'대기',vote:'투표',result:'결과 공개',grading:'채점',closed:'종료'};
const PHASE_HELP={
  ready:'각 반은 아래 "반별 제출 단계"에 따라 개별적으로 화면이 바뀝니다.',
  vote:'모든 반의 제출이 잠기고, 전체 반 통합 갤러리·투표가 열립니다.',
  result:'투표가 잠기고 상위 3작품만 공개됩니다.',
  grading:'학생 화면은 종료 안내로 바뀝니다. 채점에 집중하세요.',
  closed:'모든 학생 활동이 닫힙니다.'
};
const CLASS_PHASE_LABELS={ready:'대기',submit:'제출 열기',locked:'마감'};
let PIN='', ROWS=[], STATUS=null;

async function api(action,payload={}){
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({action,pin:PIN},payload))});
  const d=await res.json();
  if(!d.ok) throw new Error(d.error||'오류');
  return d;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3400);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function login(){
  PIN=document.getElementById('pin').value.trim();
  try{
    await api('adminLogin');
    localStorage.setItem('adminPin',PIN);
    document.getElementById('pinCard').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    loadAll();
  }catch(e){ toast(e.message); }
}

async function loadAll(){
  try{
    STATUS=(await api('adminStatus'));
    ROWS=(await api('adminList')).rows;
    renderClassPhase(); renderPhase(); renderStatus(); renderList();
  }catch(e){ toast(e.message); }
}

function renderClassPhase(){
  const box=document.getElementById('classPhaseBox'); box.innerHTML='';
  const globalActive = STATUS.phase!=='ready';
  STATUS.classes.forEach(k=>{
    const cur=STATUS.classPhases[k];
    const c=STATUS.byClass[k]||{total:0,submitted:0,assigned:0};
    const wrap=document.createElement('div'); wrap.className='classcard';
    const pct = c.total ? Math.round(c.submitted/c.total*100) : 0;
    wrap.innerHTML=`
      <h3>${esc(k)}반 <span class="muted" style="font-family:'Gowun Dodum',sans-serif;font-size:13px">· 지역 배정 ${c.assigned}/${c.total} · 제출 ${c.submitted}/${c.total}</span></h3>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="row" id="cbtns-${k}"></div>
      ${globalActive?'<p class="muted" style="margin:6px 0 0">전체 단계가 "'+PHASE_LABELS[STATUS.phase]+'"이라 지금은 이 버튼이 적용되지 않아요.</p>':''}`;
    box.appendChild(wrap);
    const btnBox=wrap.querySelector('#cbtns-'+k);
    Object.keys(CLASS_PHASE_LABELS).forEach(p=>{
      const b=document.createElement('button');
      b.textContent=CLASS_PHASE_LABELS[p];
      if(p==='locked') b.classList.add('warn');
      if(p===cur) b.classList.add('on');
      b.disabled=globalActive;
      b.onclick=async()=>{
        if(p==='locked' && !confirm(k+'반 제출을 마감할까요? 학생 화면에 즉시 마감 안내가 뜹니다.')) return;
        try{ await api('adminSetClassPhase',{klass:k,phase:p}); toast(k+'반을 "'+CLASS_PHASE_LABELS[p]+'"(으)로 바꿨습니다.'); loadAll(); }
        catch(e){ toast(e.message); }
      };
      btnBox.appendChild(b);
    });
  });
}

function renderPhase(){
  const box=document.getElementById('phaseBtns'); box.innerHTML='';
  Object.keys(PHASE_LABELS).forEach(p=>{
    const b=document.createElement('button');
    b.textContent=PHASE_LABELS[p];
    if(p===STATUS.phase) b.classList.add('on');
    b.onclick=async()=>{
      if(!confirm('전체 단계를 "'+PHASE_LABELS[p]+'"(으)로 바꿀까요?'+(p==='vote'?'\n\n모든 반의 제출이 잠깁니다.':''))) return;
      try{ await api('adminSetPhase',{phase:p}); toast('단계를 바꿨습니다.'); loadAll(); }catch(e){ toast(e.message); }
    };
    box.appendChild(b);
  });
  document.getElementById('phaseHelp').textContent=PHASE_HELP[STATUS.phase]||'';
  document.getElementById('sheetBtn').onclick=()=>window.open(STATUS.sheetUrl,'_blank');
}

function renderStatus(){
  const c=STATUS.byClass;
  let html='<table><tr><th>반</th><th>지역 배정</th><th>제출</th><th>투표</th></tr>';
  Object.keys(c).sort().forEach(k=>{
    html+=`<tr><td>${esc(k)}</td><td>${c[k].assigned} / ${c[k].total}</td><td>${c[k].submitted} / ${c[k].total}</td><td>${c[k].voted} / ${c[k].total}</td></tr>`;
  });
  html+='</table>';
  html+=`<p class="muted" style="margin-top:10px">
    지역 ${STATUS.regionsUsed} / ${STATUS.totalRegions}개 배정됨 (${STATUS.regionScope==='class'?'반별 중복 허용':'전체 중복 없음'})
    · 총 제출 ${STATUS.totalSubmitted} / ${STATUS.totalStudents}명</p>`;
  if(STATUS.noSubmit.length) html+=`<div class="field"><b>미제출 ${STATUS.noSubmit.length}명</b>${esc(STATUS.noSubmit.join(' / '))}</div>`;
  if(STATUS.phase==='vote'&&STATUS.noVote.length) html+=`<div class="field"><b>미투표 ${STATUS.noVote.length}명</b>${esc(STATUS.noVote.join(' / '))}</div>`;
  document.getElementById('status').innerHTML=html;
}

function tagFor(s){
  const cls=s==='확정'?'done':s==='AI추천'?'ai':'none';
  return `<span class="tag ${cls}">${esc(s)}</span>`;
}

function renderList(){
  const f=document.getElementById('filter').value;
  const rows=ROWS.filter(r=>!f||r.state===f);
  let html='<tr><th>학번</th><th>이름</th><th>반</th><th>지역</th><th>작품</th><th>득표</th><th>점수</th><th>상태</th></tr>';
  rows.forEach(r=>{
    html+=`<tr class="clickable" onclick="openDetail('${r.sid}')">
      <td>${esc(r.sid)}</td><td>${esc(r.name)}</td><td>${esc(r.klass)}</td>
      <td>${esc(r.region)}</td><td>${esc(r.workId)}</td><td>${r.votes}</td>
      <td>${r.total===null?'–':r.total}</td><td>${tagFor(r.state)}</td></tr>`;
  });
  document.getElementById('list').innerHTML=html;
}

async function openDetail(sid){
  const box=document.getElementById('detail');
  box.classList.remove('hidden');
  box.innerHTML='<p class="muted">불러오는 중…</p>';
  box.scrollIntoView({behavior:'smooth'});
  try{
    const r=await api('adminDetail',{sid});
    renderDetail(r.data, r.score||{});
  }catch(e){ box.innerHTML='<p class="muted">'+esc(e.message)+'</p>'; }
}

function renderDetail(d,sc){
  const assets=(d.assets||[]).map((a,i)=>`<div class="field"><b>자산 유형 ${i+1} · ${esc(a.type)}</b>${esc(a.geo)}</div>`).join('');
  const refs=(d.refs||[]).map((r,i)=>`<div class="field"><b>자료 ${i+1} · ${esc(r.kind)}</b>${esc(r.title)}\n${esc(r.url)}</div>`).join('');
  document.getElementById('detail').innerHTML=`
  <div class="row" style="justify-content:space-between">
    <h2 style="margin:0;font-size:19px">${esc(d.klass)}반 ${esc(d.sid)} ${esc(d.name)} · ${esc(d.region)}</h2>
    <button onclick="document.getElementById('detail').classList.add('hidden')">닫기</button>
  </div>
  <div class="split" style="margin-top:14px">
    <div>
      <img src="${esc(d.imageUrl)}" style="width:100%;max-width:320px;border-radius:16px;background:#fff" alt="도안">
      <div class="field"><b>슬로건</b>${esc(d.slogan)}</div>
      <div class="field"><b>자산명</b>${esc(d.assetName)}</div>
      ${assets}
      <div class="field"><b>형성 과정 (${(d.formation||'').length}자)</b>${esc(d.formation)}</div>
      ${refs}
      <div class="field"><b>도안 설명</b>${esc(d.designDesc)}</div>
      <div class="field"><b>AI 도구 · 프롬프트 원문 (${esc(d.aiTool)})</b>${esc(d.prompt)}</div>
      <div class="field"><b>수정 과정</b>${esc(d.revision)}</div>
      <div class="field"><b>타겟</b>${esc(d.target)}</div>
      <div class="field"><b>판매·배포 장소 / 방식</b>${esc(d.place)}\n${esc(d.method)}</div>
      <div class="field"><b>예상 가격과 근거</b>${esc(d.price)}</div>
      <div class="field"><b>지역 변화 ❶ · ${esc(d.change1Key)}</b>${esc(d.change1)}</div>
      <div class="field"><b>지역 변화 ❷ · ${esc(d.change2Key)}</b>${esc(d.change2)}</div>
    </div>
    <div>
      <div class="scorebox">
        ${sBox('s1','① 자산(6)',sc.s1)}${sBox('s2','② 브랜딩(7)',sc.s2)}
        ${sBox('s3a','③ 활용(3)',sc.s3a)}${sBox('s3b','③ 변화❶(2)',sc.s3b)}${sBox('s3c','③ 변화❷(2)',sc.s3c)}
      </div>
      <p style="margin:14px 0 4px">합계 <span class="total" id="tot">–</span> / 20 <span class="muted">(기본 2점 보장)</span></p>
      <label class="muted">채점 근거 · 피드백</label>
      <textarea id="reason" style="min-height:180px">${esc(sc.reason)}</textarea>
      <div class="row" style="margin-top:12px">
        <button onclick="aiGrade('${d.sid}')" id="aiBtn">AI 추천 점수 받기</button>
        <button class="primary" onclick="saveScore('${d.sid}')">점수 확정 저장</button>
      </div>
      <p class="muted" style="margin-top:8px">AI 점수는 추천값입니다. 확인·수정 후 확정하세요.</p>
    </div>
  </div>`;
  ['s1','s2','s3a','s3b','s3c'].forEach(id=>document.getElementById(id).addEventListener('input',calcTotal));
  calcTotal();
}

function sBox(id,label,val){
  const opts={s1:[0,2,4,6],s2:[1,3,5,7],s3a:[0,1,2,3],s3b:[0,1,2],s3c:[0,1,2]}[id];
  return `<div><label>${label}</label><select id="${id}">
    <option value="">–</option>${opts.map(o=>`<option ${String(val)===String(o)?'selected':''}>${o}</option>`).join('')}
  </select></div>`;
}

function calcTotal(){
  const n=id=>Number(document.getElementById(id).value||0);
  const sum=n('s1')+n('s2')+n('s3a')+n('s3b')+n('s3c');
  document.getElementById('tot').textContent=Math.min(20,Math.max(2,sum));
}

async function aiGrade(sid){
  const b=document.getElementById('aiBtn'); b.disabled=true; b.textContent='채점 중…';
  try{
    const r=await api('adminAiGrade',{sid,autoSave:false});
    ['s1','s2','s3a','s3b','s3c'].forEach(k=>document.getElementById(k).value=r.score[k]);
    document.getElementById('reason').value=r.reason;
    calcTotal(); toast('AI 추천 점수를 불러왔습니다. 확인 후 확정하세요.');
  }catch(e){ toast(e.message); }
  finally{ b.disabled=false; b.textContent='AI 추천 점수 받기'; }
}

async function saveScore(sid){
  const v=id=>document.getElementById(id).value;
  if(['s1','s2','s3a','s3b','s3c'].some(k=>v(k)==='')) return toast('비어 있는 항목이 있습니다.');
  try{
    await api('adminSaveScore',{sid,score:{s1:v('s1'),s2:v('s2'),s3a:v('s3a'),s3b:v('s3b'),s3c:v('s3c')},reason:v('reason')});
    toast('확정 저장했습니다.'); loadAll();
  }catch(e){ toast(e.message); }
}

async function gradeAll(){
  const targets=ROWS.filter(r=>r.state==='미채점');
  if(!targets.length) return toast('미채점 학생이 없습니다.');
  if(!confirm(targets.length+'명을 AI 채점합니다. 시간이 걸립니다. 계속할까요?')) return;
  const b=document.getElementById('allBtn'); b.disabled=true;
  let ok=0, fail=0;
  for(let i=0;i<targets.length;i++){
    b.textContent=`채점 중 ${i+1}/${targets.length}`;
    try{ await api('adminAiGrade',{sid:targets[i].sid,autoSave:true}); ok++; }
    catch(e){ fail++; }
  }
  b.disabled=false; b.textContent='미채점 전체 AI 채점';
  toast(`완료 ${ok}명 / 실패 ${fail}명`);
  loadAll();
}

async function recount(){
  try{ const r=await api('adminRecount'); toast('득표수를 다시 집계했습니다.'); loadAll(); }
  catch(e){ toast(e.message); }
}

document.getElementById('pin').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
(function(){ const p=localStorage.getItem('adminPin'); if(p){ document.getElementById('pin').value=p; login(); } })();
</script>
</body>
</html>
